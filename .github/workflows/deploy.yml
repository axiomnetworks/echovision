name: Deploy CPU smoke test to Modal
# Manual only. Adding code or secrets must not launch paid resources.
on:
  workflow_dispatch:
    inputs:
      approved_test:
        description: Confirm account, limits, credit coverage and test budget were reviewed
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: echovision-modal-smoke
  cancel-in-progress: false
jobs:
  deploy:
    if: inputs.approved_test == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deployment SDK
        run: python -m pip install modal
      - name: Deploy CPU smoke test
        run: modal deploy backend.py
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
